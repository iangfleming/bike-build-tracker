<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bike Build Tracker</title>
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <header class="app-header">
    <div class="header-top">
      <h1 class="app-title">Bike Build Tracker</h1>
      <div class="header-actions">
        <select id="build-switcher" aria-label="Switch build"></select>
        <button type="button" id="new-build-btn" class="btn btn-secondary">+ New Build</button>
        <button type="button" id="new-group-btn" class="btn btn-secondary">+ New Category</button>
      </div>
    </div>
    <div class="header-settings">
      <input type="text" id="build-name" aria-label="Build name" placeholder="Build name">
      <label class="setting">
        Currency
        <input type="text" id="currency-symbol" aria-label="Currency symbol" size="3" maxlength="5" value="$">
      </label>
      <label class="setting">
        Filter
        <select id="acquired-filter" aria-label="Filter items">
          <option value="all">Show all</option>
          <option value="acquired">Acquired only</option>
          <option value="remaining">Remaining only</option>
        </select>
      </label>
    </div>
  </header>

  <div id="summary-bar" class="summary-bar" role="status"></div>

  <main id="app-main" class="app-main">
    <div class="app-layout">
      <div class="app-content">
        <div id="builds-list" class="builds-list" hidden>
          <h2>Your builds</h2>
          <ul id="builds-list-items"></ul>
        </div>
        <div id="build-view">
          <div id="category-groups"></div>
        </div>
      </div>

      <aside id="sidebar" class="app-sidebar" aria-label="Build actions">
        <h2 class="sidebar-title">Build actions</h2>
        <div class="sidebar-actions">
          <button type="button" id="clear-defaults-btn" class="btn">Clear Defaults</button>
          <button type="button" id="export-csv-btn" class="btn">Export CSV</button>
          <button type="button" id="import-csv-btn" class="btn">Import CSV</button>
          <button type="button" id="export-json-btn" class="btn">Export Backup (JSON)</button>
          <button type="button" id="import-json-btn" class="btn">Import Backup (JSON)</button>
          <button type="button" id="reset-btn" class="btn btn-danger">Reset All Data</button>
        </div>
        <p class="sidebar-note">All data is stored locally in your browser. No accounts, no servers.</p>
      </aside>
    </div>
  </main>

  <input type="file" id="import-csv-input" accept=".csv,text/csv" hidden>
  <input type="file" id="import-json-input" accept=".json,application/json" hidden>

  <div id="toast" class="toast" hidden></div>

  <div id="modal-backdrop" class="modal-backdrop" hidden>
    <div id="modal" class="modal" role="dialog" aria-modal="true"></div>
  </div>

  <script type="module" src="js/main.js"></script>
</body>
</html>
